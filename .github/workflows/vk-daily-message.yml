name: VK daily message

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-message:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run one-time VK test chat
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
        run: node scripts/vk-midnight-message.mjs
