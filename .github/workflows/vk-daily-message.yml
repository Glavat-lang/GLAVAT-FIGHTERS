name: VK daily message

on:
  schedule:
    # 00:00 in Perm (Asia/Yekaterinburg, UTC+5)
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send-message:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Send VK message
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
        run: node scripts/vk-midnight-message.mjs
